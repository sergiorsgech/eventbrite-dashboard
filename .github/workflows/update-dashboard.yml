name: Update Eventbrite dashboard

"on":
  schedule:
    # Twice a day. Times are UTC and do NOT auto-adjust for daylight saving,
    # so these will drift by an hour for a few weeks around the March/
    # November clock changes.
    # 15:00 UTC ≈ 8:00 AM Pacific (PDT, UTC-7)
    # 22:00 UTC ≈ 3:00 PM Pacific (PDT, UTC-7)
    - cron: "0 15 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the refreshed dashboard back to the repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild dashboard from Eventbrite
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: |
          python3 eventbrite_tool.py dashboard --out index.html

      - name: Commit refreshed dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Eventbrite dashboard"
          file_pattern: "index.html .eventbrite_ticket_cache.json"

      # IMPORTANT: commits made with the default GITHUB_TOKEN (like the one above)
      # do NOT trigger other workflows, so the separate "Azure Static Web Apps
      # CI/CD" workflow never fires after this job commits fresh data — the
      # live site would silently stay stuck on whatever was last deployed.
      # Deploying directly here, in the same run, avoids relying on that
      # cross-workflow trigger entirely.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_OCEAN_06941A610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "."
